name: runbookos-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-runbookos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-n8n-db.sh:/docker-entrypoint-initdb.d/init-n8n-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-runbookos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:?Set REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  n8n:
    image: n8nio/n8n:2.30.3
    restart: unless-stopped
    environment: &n8n-environment
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_HOST: ${APP_HOST:?Set APP_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${APP_HOST}/n8n/
      N8N_EDITOR_BASE_URL: https://${APP_HOST}/n8n/
      N8N_PATH: /n8n/
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?Set INTERNAL_HMAC_SECRET}
      CONTROL_PLANE_URL: http://control-plane:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  n8n-worker:
    image: n8nio/n8n:2.30.3
    restart: unless-stopped
    command: ["worker", "--concurrency=5"]
    environment: *n8n-environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [internal]

  control-plane:
    build:
      context: ./services/control-plane
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-runbookos}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_BASE_URL: http://n8n:5678
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-primary}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      CORS_ALLOWED_ORIGINS: https://${APP_HOST}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 45s
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      control-plane: { condition: service_started }
    networks: [internal]

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx/runbookos.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR}:/etc/nginx/tls:ro
    depends_on:
      web: { condition: service_started }
      control-plane: { condition: service_started }
      n8n: { condition: service_healthy }
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.9.1
    profiles: [observability]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:12.4.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  prometheus_data:
  grafana_data:
