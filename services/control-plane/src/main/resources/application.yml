server:
  port: ${CONTROL_PLANE_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: runbookos-control-plane

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:runbookos}
    username: ${POSTGRES_USER:runbookos}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000

  lifecycle:
    timeout-per-shutdown-phase: 30s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# OpenAPI
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui
    operations-sorter: method
  show-actuator: false

# Application
# Secrets have no defaults on purpose: the application must fail to start rather than
# run with a well-known key. See .env.example for placeholders.
runbookos:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:runbookos}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    encryption-key: ${ENCRYPTION_KEY}
    encryption-key-id: ${ENCRYPTION_KEY_ID:primary}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:runbookos_refresh}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    password-hash-strength: ${PASSWORD_HASH_STRENGTH:12}
  n8n:
    base-url: ${N8N_BASE_URL:http://localhost:5678}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging:
  level:
    root: INFO
    com.vaibhav.runbookos: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
