name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Backend: Format check, compile, unit tests
  # -----------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x services/control-plane/gradlew

      - name: Check Java formatting (Spotless)
        working-directory: services/control-plane
        run: ./gradlew spotlessCheck --no-daemon

      - name: Compile
        working-directory: services/control-plane
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run unit and integration tests
        working-directory: services/control-plane
        run: ./gradlew test --no-daemon
        env:
          # Tests use Testcontainers — Docker is available on GitHub Actions runners
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: services/control-plane/build/reports/tests/

  # -----------------------------------------------------------------------
  # Frontend: Lint, type-check, production build
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: apps/web
        run: npm run format:check

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript strict check
        working-directory: apps/web
        run: npm run type-check

      - name: Production build
        working-directory: apps/web
        run: npm run build
        env:
          # Allow builds to proceed without backend
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # -----------------------------------------------------------------------
  # Docker: Verify images build successfully
  # -----------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control-plane image
        uses: docker/build-push-action@v5
        with:
          context: services/control-plane
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
