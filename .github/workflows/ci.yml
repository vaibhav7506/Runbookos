name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Filesystem dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
  # -----------------------------------------------------------------------
  # Backend: Format check, compile, unit tests
  # -----------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x services/control-plane/gradlew

      - name: Check Java formatting (Spotless)
        working-directory: services/control-plane
        run: ./gradlew spotlessCheck --no-daemon

      - name: Compile
        working-directory: services/control-plane
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run unit and integration tests
        working-directory: services/control-plane
        run: ./gradlew test --no-daemon
        env:
          # Tests use Testcontainers — Docker is available on GitHub Actions runners
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: services/control-plane/build/reports/tests/

  # -----------------------------------------------------------------------
  # Frontend: Lint, type-check, production build
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: apps/web
        run: npm run format:check

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript strict check
        working-directory: apps/web
        run: npm run type-check

      - name: Component and form tests
        working-directory: apps/web
        run: npm test

      - name: Production build
        working-directory: apps/web
        run: npm run build
        env:
          # Allow builds to proceed without backend
          NEXT_PUBLIC_API_URL: http://localhost:8080

  workflows:
    name: Workflow and analysis validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate n8n exports
        run: node scripts/validate-workflows.mjs
      - name: Evaluate deterministic analysis dataset
        run: node scripts/evaluate-analysis.mjs

  # -----------------------------------------------------------------------
  # Docker: Verify images build successfully
  # -----------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, workflows]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control-plane image
        uses: docker/build-push-action@v5
        with:
          context: services/control-plane
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end demo smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, workflows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start complete local stack
        run: docker compose up -d --build
      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/register >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: Run Playwright flows
        working-directory: apps/web
        run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
      - name: Capture container logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log
