<!doctype html>
<html lang="en">
<body style="margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f">
  <main style="box-sizing:border-box;max-width:640px;margin:auto;padding:24px">
    <section style="background:#fff;border:1px solid #e5e5e7;border-radius:16px;padding:28px">
      <p style="font-size:12px;color:#6e6e73">RUNBOOKOS INCIDENT DIGEST</p>
      <h1 style="font-size:24px">{{periodLabel}}</h1>
      <p style="line-height:1.6">{{incidentCount}} incidents · {{resolvedCount}} resolved · {{approvalCount}} approvals pending</p>
      <div style="padding:16px;border-radius:12px;background:#f5f5f7;white-space:pre-line">{{incidentSummary}}</div>
      <a href="{{dashboardUrl}}" style="display:inline-block;margin-top:20px;color:#06c">Open operational overview</a>
    </section>
  </main>
</body>
</html>
