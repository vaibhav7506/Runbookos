<!doctype html>
<html lang="en">
<body style="margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:24px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:auto;background:#fff;border:1px solid #e5e5e7;border-radius:16px">
      <tr><td style="padding:28px"><p style="margin:0 0 8px;font-size:12px;color:#6e6e73">RUNBOOKOS APPROVAL</p>
        <h1 style="margin:0 0 16px;font-size:24px">{{incidentTitle}}</h1>
        <p style="line-height:1.6;color:#424245">{{actionSummary}}</p>
        <p><strong>Risk:</strong> {{riskLevel}}<br><strong>Expires:</strong> {{expiresAt}}</p>
        <a href="{{approvalUrl}}" style="display:inline-block;margin-top:12px;padding:12px 18px;border-radius:10px;background:#1d1d1f;color:#fff;text-decoration:none">Review approval</a>
        <p style="margin-top:24px;font-size:12px;color:#6e6e73">Do not forward this identity-bound approval link.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
