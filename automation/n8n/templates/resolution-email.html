<!doctype html>
<html lang="en">
<body style="margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f">
  <main style="box-sizing:border-box;max-width:640px;margin:auto;padding:24px">
    <section style="background:#fff;border:1px solid #e5e5e7;border-radius:16px;padding:28px">
      <p style="font-size:12px;color:#248a3d">INCIDENT RESOLVED</p>
      <h1 style="font-size:24px">{{incidentTitle}}</h1>
      <p style="line-height:1.6;color:#424245">{{resolutionSummary}}</p>
      <p><strong>Duration:</strong> {{duration}}<br><strong>Affected service:</strong> {{service}}</p>
      <a href="{{postmortemUrl}}" style="display:inline-block;margin-top:12px;color:#06c">Review postmortem</a>
    </section>
  </main>
</body>
</html>
